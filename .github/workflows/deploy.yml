name: Deploy to Azure App Service

on:
  push:
    branches:
      - main  # Se ejecuta en cada push a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Usa la versión de Node.js que prefieras

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas (opcional)
        run: npm test

      - name: Empaquetar la aplicación
        run: zip -r release.zip . -x "*.git*"

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: "mi-app-en-azure"  # Cambia esto por el nombre de tu App Service
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
